name: Website · GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tool/site/**'
      - 'lib/core/l10n/app_*.arb'
      - 'lib/core/l10n/language_names.dart'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tool/site/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
